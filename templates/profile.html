<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile | Hope Kuku Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <style>
        .profile-container { max-width: 600px; margin: 80px auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: var(--shadow); }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        .form-group input { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">My Profile</div>
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}">Home</a></li>
            <li><a href="{{ url_for('user_dashboard') }}">Dashboard</a></li>
        </ul>
    </nav>

    <div class="profile-container">
        <h2>Update Profile Information</h2>
        {% with messages = get_flashed_messages() %}{% if messages %}{% for m in messages %}<div style="color:green; margin-bottom:10px;">{{ m }}</div>{% endfor %}{% endif %}{% endwith %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="first_name" value="{{ current_user.first_name }}" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="last_name" value="{{ current_user.last_name }}" required>
                </div>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" value="{{ current_user.phone or '' }}">
            </div>
            <div class="form-group">
                <label>Default Street Address</label>
                <input type="text" name="address" value="{{ current_user.address or '' }}">
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" name="city" value="{{ current_user.city or 'Nairobi' }}">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Save Changes</button>
        </form>
    </div>
</body>
</html>
